# xcodegen spec — generates Schnellbild.xcodeproj for the app + XCUITests.
# The .xcodeproj itself is generated (gitignored); this file is the source.
# Run:  xcodegen generate
name: Schnellbild
options:
  bundleIdPrefix: art.haushoppe
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  # The app and its thumbnail extension are signed with the entitlements they
  # ship with, from Sandbox/ without what only a profile allows
  # (Scripts/entitlements.sh); Scripts/check_entitlements.sh holds the built
  # app to them
  preGenCommand: Scripts/entitlements.sh --all build/entitlements

settings:
  base:
    SWIFT_VERSION: "5.0"          # match the SwiftPM build's language mode
    MARKETING_VERSION: "0.12.2"
    CURRENT_PROJECT_VERSION: "16"
    # Ad-hoc sign (no Apple team needed) so the app + UI-test runner launch
    # without Gatekeeper flagging them as "damaged".
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
    # The App Sandbox as the app ships with it (made by preGenCommand)
    SCHNELLBILD_APP_ENTITLEMENTS: build/entitlements/app.entitlements

targets:
  # Archives: the vendored UnRAR source (Scripts/fetch_unrar.sh) behind a small
  # C face; Swift imports it as the module CArchives. The same build as in
  # Package.swift (sources: UnRAR's makefile, OBJECTS and LIB_OBJ).
  CArchives:
    type: library.static
    platform: macOS
    sources:
      - path: Native/CArchives/rar_shim.cpp
      - path: Native/CArchives/libarchive_shim.cpp
      - path: Vendor/unrar
        includes:
          - rar.cpp
          - strlist.cpp
          - strfn.cpp
          - pathfn.cpp
          - smallfn.cpp
          - global.cpp
          - file.cpp
          - filefn.cpp
          - filcreat.cpp
          - archive.cpp
          - arcread.cpp
          - unicode.cpp
          - system.cpp
          - crypt.cpp
          - crc.cpp
          - rawread.cpp
          - encname.cpp
          - resource.cpp
          - match.cpp
          - timefn.cpp
          - rdwrfn.cpp
          - consio.cpp
          - options.cpp
          - errhnd.cpp
          - rarvm.cpp
          - secpassword.cpp
          - rijndael.cpp
          - getbits.cpp
          - sha1.cpp
          - sha256.cpp
          - blake2s.cpp
          - hash.cpp
          - extinfo.cpp
          - extract.cpp
          - volume.cpp
          - list.cpp
          - find.cpp
          - unpack.cpp
          - headers.cpp
          - threadpool.cpp
          - rs16.cpp
          - cmddata.cpp
          - ui.cpp
          - largepage.cpp
          - filestr.cpp
          - scantree.cpp
          - dll.cpp
          - qopen.cpp
    settings:
      base:
        GCC_PREPROCESSOR_DEFINITIONS: ["RARDLL", "_FILE_OFFSET_BITS=64", "_LARGEFILE_SOURCE", "RAR_SMP"]
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Native/CArchives"]

  # Camera RAW formats ImageIO doesn't read: the vendored LibRaw source
  # (Scripts/fetch_libraw.sh) behind a small C face; Swift imports it as the
  # module CRaw. The same build as in Package.swift (sources: LIB_OBJECTS
  # of LibRaw's Makefile.dist).
  CRaw:
    type: library.static
    platform: macOS
    sources:
      - path: Native/CRaw/raw_shim.cpp
      - path: Vendor/libraw
        includes:
          - src/libraw_datastream.cpp
          - src/libraw_c_api.cpp
          - src/tables/cameralist.cpp
          - src/decoders/fuji_compressed.cpp
          - src/decoders/crx.cpp
          - src/decoders/pana8.cpp
          - src/decoders/fp_dng.cpp
          - src/decoders/decoders_libraw.cpp
          - src/decoders/olympus14.cpp
          - src/decoders/sonycc.cpp
          - src/decompressors/losslessjpeg.cpp
          - src/decoders/unpack.cpp
          - src/decoders/unpack_thumb.cpp
          - src/integration/rawspeed_glue.cpp
          - src/integration/dngsdk_glue.cpp
          - src/tables/colorconst.cpp
          - src/utils/utils_libraw.cpp
          - src/utils/init_close_utils.cpp
          - src/utils/decoder_info.cpp
          - src/utils/open.cpp
          - src/utils/phaseone_processing.cpp
          - src/utils/thumb_utils.cpp
          - src/write/tiff_writer.cpp
          - src/preprocessing/subtract_black.cpp
          - src/postprocessing/postprocessing_utils.cpp
          - src/postprocessing/dcraw_process.cpp
          - src/preprocessing/raw2image.cpp
          - src/postprocessing/mem_image.cpp
          - src/x3f/x3f_utils_patched.cpp
          - src/x3f/x3f_parse_process.cpp
          - src/utils/read_utils.cpp
          - src/utils/curves.cpp
          - src/utils/utils_dcraw.cpp
          - src/tables/colordata.cpp
          - src/decoders/canon_600.cpp
          - src/decoders/decoders_dcraw.cpp
          - src/decoders/decoders_libraw_dcrdefs.cpp
          - src/decoders/generic.cpp
          - src/decoders/kodak_decoders.cpp
          - src/decoders/dng.cpp
          - src/decoders/smal.cpp
          - src/decoders/load_mfbacks.cpp
          - src/metadata/sony.cpp
          - src/metadata/nikon.cpp
          - src/metadata/samsung.cpp
          - src/metadata/cr3_parser.cpp
          - src/metadata/canon.cpp
          - src/metadata/epson.cpp
          - src/metadata/olympus.cpp
          - src/metadata/leica.cpp
          - src/metadata/fuji.cpp
          - src/metadata/adobepano.cpp
          - src/metadata/pentax.cpp
          - src/metadata/p1.cpp
          - src/metadata/makernotes.cpp
          - src/metadata/exif_gps.cpp
          - src/metadata/kodak.cpp
          - src/metadata/tiff.cpp
          - src/metadata/ciff.cpp
          - src/metadata/mediumformat.cpp
          - src/metadata/minolta.cpp
          - src/metadata/identify_tools.cpp
          - src/metadata/hasselblad_model.cpp
          - src/metadata/normalize_model.cpp
          - src/metadata/identify.cpp
          - src/metadata/misc_parsers.cpp
          - src/tables/wblists.cpp
          - src/postprocessing/postprocessing_aux.cpp
          - src/postprocessing/postprocessing_utils_dcrdefs.cpp
          - src/postprocessing/aspect_ratio.cpp
          - src/demosaic/misc_demosaic.cpp
          - src/demosaic/xtrans_demosaic.cpp
          - src/demosaic/ahd_demosaic.cpp
          - src/demosaic/dht_demosaic.cpp
          - src/demosaic/aahd_demosaic.cpp
          - src/demosaic/dcb_demosaic.cpp
          - src/write/file_write.cpp
          - src/preprocessing/ext_preprocess.cpp
          - src/write/apply_profile.cpp
    settings:
      base:
        GCC_PREPROCESSOR_DEFINITIONS: ["USE_ZLIB", "LIBRAW_MAX_ALLOC_MB_DEFAULT=1024L", "LIBRAW_MAX_THUMBNAIL_MB=64L"]
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Native/CRaw", "$(SRCROOT)/Vendor/libraw"]

  # The offline map (OpenStreetMap data drawn with CoreGraphics, the place
  # index, the SwiftUI map view); its files come from Scripts/fetch_map.sh
  OfflineMap:
    type: library.static
    platform: macOS
    sources:
      - path: OfflineMap

  # What the app and its thumbnail extension share of VLC
  VLCFrames:
    type: library.static
    platform: macOS
    sources:
      - path: VLCFrames
    dependencies:
      - framework: Vendor/VLCKit.xcframework
        embed: false

  # QuickLook thumbnails of the videos QuickLook can't read (MKV, WebM, WMV,
  # ASF, FLV, Ogg, VOB),
  # in the App Sandbox; uses the app's VLCKit
  SchnellbildThumbnails:
    type: app-extension
    platform: macOS
    sources:
      - path: ThumbnailExtension
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.haushoppe.schnellbild.thumbnails
        PRODUCT_NAME: SchnellbildThumbnails
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ThumbnailExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: build/entitlements/thumbnails.entitlements
        LD_RUNPATH_SEARCH_PATHS: ["@executable_path/../Frameworks", "@executable_path/../../../../Frameworks"]
        OTHER_SWIFT_FLAGS: ["-parse-as-library"]   # no main: the entry point is the system's extension main
        ENABLE_DEBUG_DYLIB: NO   # one binary, so the step below finds VLCKit's load command in it
    postBuildScripts:
      # VLCKit is the app's, four levels up from the extension's binary (its
      # own install name points next to an app's binary). Xcode signs after this.
      - name: Load the app's VLCKit
        basedOnDependencyAnalysis: false
        script: |
          install_name_tool -change @loader_path/../Frameworks/VLCKit.framework/Versions/A/VLCKit \
            @executable_path/../../../../Frameworks/VLCKit.framework/Versions/A/VLCKit "$TARGET_BUILD_DIR/$EXECUTABLE_PATH"
    dependencies:
      - target: VLCFrames
      - sdk: QuickLookThumbnailing.framework
      - framework: Vendor/VLCKit.xcframework
        embed: false

  Schnellbild:
    type: application
    platform: macOS
    sources:
      - path: Schnellbild
      # The UI's translations; the .lproj folders become localized resources
      - path: Resources/Localization
        buildPhase: resources
      # The license texts the About window shows: Schnellbild's own and
      # those of everything the app carries
      - path: LICENSE
        buildPhase: resources
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
      # The offline map's files (Scripts/fetch_map.sh), as Resources/Map
      - path: Vendor/Map
        type: folder
        buildPhase: resources
      # The globe's data (Scripts/fetch_globe.sh), as Resources/Globe
      - path: Vendor/Globe
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.haushoppe.schnellbild
        # Xcode adds its own exceptions for testing on top (read-only access
        # to the whole disk, testmanagerd), so the UI tests on CI launch the
        # bundle build_app.sh makes instead (SCHNELLBILD_APP)
        CODE_SIGN_ENTITLEMENTS: $(SCHNELLBILD_APP_ENTITLEMENTS)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Resources/ExportedTypes.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 HAUS HOPPE - ITS (Johannes Hoppe). MIT License."
        SWIFT_INCLUDE_PATHS: ["$(SRCROOT)/Native/CArchives/include", "$(SRCROOT)/Native/CRaw/include"]
        OTHER_LDFLAGS: ["-lc++", "-lz"]
    dependencies:
      - target: CArchives
      - target: CRaw
      - target: VLCFrames
      - target: OfflineMap
      - target: SchnellbildThumbnails
        embed: true
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - framework: Vendor/VLCKit.xcframework
        embed: true

  SchnellbildUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
        excludes: ["Runner.entitlements"]
      # The app's translations: ReadmeScreenshots finds the words it clicks
      # in the language it takes the screenshots in
      - path: Resources/Localization
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.haushoppe.schnellbild.uitests
        # The runner, never shipped: may write where the tests make their folders
        CODE_SIGN_ENTITLEMENTS: UITests/Runner.entitlements
    dependencies:
      - target: Schnellbild

schemes:
  Schnellbild:
    build:
      targets:
        Schnellbild: all
        SchnellbildUITests: [test]
    test:
      targets:
        - SchnellbildUITests
