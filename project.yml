# xcodegen spec — generates Schnellbild.xcodeproj for the app + XCUITests.
# The .xcodeproj itself is generated (gitignored); this file is the source.
# Run:  xcodegen generate
name: Schnellbild
options:
  bundleIdPrefix: art.haushoppe
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"          # match the SwiftPM build's language mode
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "9"
    # Ad-hoc sign (no Apple team needed) so the app + UI-test runner launch
    # without Gatekeeper flagging them as "damaged".
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"

targets:
  # Archives: the vendored UnRAR source (Scripts/fetch_unrar.sh) behind a small
  # C face; Swift imports it as the module CArchives. The same build as in
  # Package.swift (sources: UnRAR's makefile, OBJECTS and LIB_OBJ).
  CArchives:
    type: library.static
    platform: macOS
    sources:
      - path: Native/CArchives/rar_shim.cpp
      - path: Vendor/unrar
        includes:
          - rar.cpp
          - strlist.cpp
          - strfn.cpp
          - pathfn.cpp
          - smallfn.cpp
          - global.cpp
          - file.cpp
          - filefn.cpp
          - filcreat.cpp
          - archive.cpp
          - arcread.cpp
          - unicode.cpp
          - system.cpp
          - crypt.cpp
          - crc.cpp
          - rawread.cpp
          - encname.cpp
          - resource.cpp
          - match.cpp
          - timefn.cpp
          - rdwrfn.cpp
          - consio.cpp
          - options.cpp
          - errhnd.cpp
          - rarvm.cpp
          - secpassword.cpp
          - rijndael.cpp
          - getbits.cpp
          - sha1.cpp
          - sha256.cpp
          - blake2s.cpp
          - hash.cpp
          - extinfo.cpp
          - extract.cpp
          - volume.cpp
          - list.cpp
          - find.cpp
          - unpack.cpp
          - headers.cpp
          - threadpool.cpp
          - rs16.cpp
          - cmddata.cpp
          - ui.cpp
          - largepage.cpp
          - filestr.cpp
          - scantree.cpp
          - dll.cpp
          - qopen.cpp
    settings:
      base:
        GCC_PREPROCESSOR_DEFINITIONS: ["RARDLL", "_FILE_OFFSET_BITS=64", "_LARGEFILE_SOURCE", "RAR_SMP"]
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Native/CArchives"]

  # What the app and its thumbnail extension share of VLC
  VLCFrames:
    type: library.static
    platform: macOS
    sources:
      - path: VLCFrames
    dependencies:
      - framework: Vendor/VLCKit.xcframework
        embed: false

  # QuickLook thumbnails of the videos QuickLook can't read (MKV, WebM, AVI …),
  # in the App Sandbox; uses the app's VLCKit
  SchnellbildThumbnails:
    type: app-extension
    platform: macOS
    sources:
      - path: ThumbnailExtension
        excludes: ["Info.plist", "ThumbnailExtension.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.haushoppe.schnellbild.thumbnails
        PRODUCT_NAME: SchnellbildThumbnails
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ThumbnailExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ThumbnailExtension/ThumbnailExtension.entitlements
        LD_RUNPATH_SEARCH_PATHS: ["@executable_path/../Frameworks", "@executable_path/../../../../Frameworks"]
        OTHER_SWIFT_FLAGS: ["-parse-as-library"]   # no main: the entry point is the system's extension main
        ENABLE_DEBUG_DYLIB: NO   # one binary, so the step below finds VLCKit's load command in it
    postBuildScripts:
      # VLCKit is the app's, four levels up from the extension's binary (its
      # own install name points next to an app's binary). Xcode signs after this.
      - name: Load the app's VLCKit
        basedOnDependencyAnalysis: false
        script: |
          install_name_tool -change @loader_path/../Frameworks/VLCKit.framework/Versions/A/VLCKit \
            @executable_path/../../../../Frameworks/VLCKit.framework/Versions/A/VLCKit "$TARGET_BUILD_DIR/$EXECUTABLE_PATH"
    dependencies:
      - target: VLCFrames
      - sdk: QuickLookThumbnailing.framework
      - framework: Vendor/VLCKit.xcframework
        embed: false

  Schnellbild:
    type: application
    platform: macOS
    sources:
      - path: Schnellbild
      # The UI's translations; the .lproj folders become localized resources
      - path: Resources/Localization
        buildPhase: resources
      # The libraries' license texts (the About window points here)
      - path: Resources/Licenses
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.haushoppe.schnellbild
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Resources/ExportedTypes.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 HAUS HOPPE - ITS (Johannes Hoppe). MIT License."
        SWIFT_INCLUDE_PATHS: ["$(SRCROOT)/Native/CArchives/include"]
        OTHER_LDFLAGS: ["-larchive", "-lc++"]
    dependencies:
      - target: CArchives
      - target: VLCFrames
      - target: SchnellbildThumbnails
        embed: true
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework
      - framework: Vendor/VLCKit.xcframework
        embed: true

  SchnellbildUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.haushoppe.schnellbild.uitests
    dependencies:
      - target: Schnellbild

schemes:
  Schnellbild:
    build:
      targets:
        Schnellbild: all
        SchnellbildUITests: [test]
    test:
      targets:
        - SchnellbildUITests
