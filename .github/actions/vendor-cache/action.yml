# The cache of Vendor/ (VLCKit, UnRAR, LibRaw, the map, the globe, the RAW
# samples), keyed on the scripts that fetch them and the files that pin them.
# A restored copy is used only while it matches the SHA-256 those scripts pin
# (Scripts/fetch_vlckit.sh and the fetch scripts it calls check it).
name: Cache Vendor
description: Restores and saves Vendor/ under a key from its fetch scripts and pins
runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: Vendor
        key: vendor-${{ hashFiles('Scripts/fetch_vlckit.sh', 'Scripts/fetch_unrar.sh', 'Scripts/fetch_libraw.sh', 'Scripts/fetch_map.sh', 'Scripts/map_data.env', 'Scripts/fetch_globe.sh', 'Scripts/globe_data.env', 'Scripts/fetch_raw_samples.sh', 'Scripts/raw_samples.env') }}
