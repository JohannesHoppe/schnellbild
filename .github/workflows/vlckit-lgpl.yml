# Builds VLCKit without VLC's GPL modules (Scripts/build_vlckit_lgpl.sh), the
# engine in every Schnellbild build, runs the unit tests against it (every
# video format must still give a picture: VideoFormatTests), and publishes it
# as a pre-release of this repository (never "latest"): Scripts/fetch_vlckit.sh
# fetches it from there by its SHA-256. Started by hand; about half an hour.
name: VLCKit without GPL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VLCKit (LGPL modules only)
    # VLC 3.0's third-party libraries (zlib 1.2.13, libpng …) test
    # TARGET_OS_MAC for the classic Mac OS and break with the macOS 26 SDK;
    # they build with the macOS 15.0 SDK (Xcode 16.0, the oldest the runner has)
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode 16.0
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "16.0"

      - name: Build
        run: ./Scripts/build_vlckit_lgpl.sh "$RUNNER_TEMP/vlckit-lgpl"

      - name: Pack the framework
        run: ditto -c -k --keepParent "$RUNNER_TEMP/vlckit-lgpl/vlckit/build/VLCKit.xcframework" VLCKit-lgpl.xcframework.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vlckit-lgpl
          path: VLCKit-lgpl.xcframework.zip
          if-no-files-found: error

  test:
    name: Unit tests with it
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vlckit-lgpl

      - name: Put it in place
        run: |
          mkdir -p Vendor
          ditto -x -k VLCKit-lgpl.xcframework.zip Vendor
          python3 -I Scripts/vlckit_licenses.py "$(find Vendor/VLCKit.xcframework -path '*VLCKit.framework/Versions/A/VLCKit' -type f | head -1)" --no-gpl

      - name: Test
        env:
          SCHNELLBILD_OWN_VLCKIT: "1"
        run: mkdir -p build && ./Scripts/test.sh

  publish:
    name: Publish it (pre-release)
    needs: [build, test]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vlckit-lgpl

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(shasum -a 256 VLCKit-lgpl.xcframework.zip | cut -d' ' -f1)
          TAG="vlckit-3.6.0-lgpl-$GITHUB_RUN_NUMBER"
          cat > notes.md <<NOTES
          VLCKit 3.6.0 (VideoLAN, tag 3.6.0, commit c73b779f; libVLC dd8bfdba) for macOS on Apple silicon, built without VLC's modules under the GPL, for Schnellbild. Not a Schnellbild release.

          Built by [Scripts/build_vlckit_lgpl.sh](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/Scripts/build_vlckit_lgpl.sh) with its patches ([Scripts/vlckit-patches](https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA/Scripts/vlckit-patches)) at commit $GITHUB_SHA, in [run $GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Every module is under the GNU LGPL 2.1 or later. Source: https://code.videolan.org/videolan/VLCKit (tag 3.6.0) and https://code.videolan.org/videolan/vlc (dd8bfdba); see THIRD-PARTY-NOTICES.md.

          SHA-256 of VLCKit-lgpl.xcframework.zip: \`$SHA\`
          NOTES
          gh release create "$TAG" VLCKit-lgpl.xcframework.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "VLCKit 3.6.0 without GPL modules (build $GITHUB_RUN_NUMBER)" --notes-file notes.md
          echo "Published $TAG, SHA-256 $SHA"
