# Builds VLCKit without VLC's GPL modules and without the modules a viewer of
# local files never needs (Scripts/build_vlckit_lgpl.sh), the engine in every
# Schnellbild build, runs the unit tests against it (every video format must
# still give a picture: VideoFormatTests), and publishes it as a pre-release
# of this repository (never "latest") with the third-party libraries' licence
# texts and the complete source it was built from: Scripts/fetch_vlckit.sh
# fetches it from there by its SHA-256 and checks the unpacked framework's
# tree SHA-256. Started by hand; about an hour.
name: VLCKit without GPL

on:
  workflow_dispatch:
    inputs:
      offline:
        description: "Build without network once the sources are in place (VLCKIT_OFFLINE=1 in build_vlckit_lgpl.sh)"
        type: boolean
        required: false
        default: false
      publish:
        description: "Publish it as a pre-release once built and tested (off: build and test only)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build VLCKit (LGPL modules only)
    runs-on: macos-15
    timeout-minutes: 360
    outputs:
      vlckit: ${{ steps.versions.outputs.vlckit }}
      vlckit_commit: ${{ steps.versions.outputs.vlckit_commit }}
      vlc: ${{ steps.versions.outputs.vlc }}
      vlc_commit: ${{ steps.versions.outputs.vlc_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: Scripts/select_xcode.sh

      # The checks that keep code under the GPL out of VLCKit
      # (vlckit_licenses.py, vlckit_contrib.py)
      - name: Tests of the VLCKit licence checks
        run: python3 -I -m unittest discover -s Scripts/tests -v

      # The versions the script builds, for the release's tag, title and notes
      - name: What is built
        id: versions
        run: ./Scripts/build_vlckit_lgpl.sh --versions | tee -a "$GITHUB_OUTPUT"

      - name: Build
        env:
          VLCKIT_OFFLINE: ${{ inputs.offline && '1' || '' }}
        run: ./Scripts/build_vlckit_lgpl.sh "$RUNNER_TEMP/vlckit-lgpl"

      # What the licence checks read (each static library's symbols, the
      # binary's, the contrib build's source files) and found
      - name: Keep what was checked
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vlckit-lgpl-check
          path: ${{ runner.temp }}/vlckit-lgpl/check/
          if-no-files-found: ignore

      - name: Pack the framework
        run: |
          ditto -c -k --keepParent "$RUNNER_TEMP/vlckit-lgpl/vlckit/build/VLCKit.xcframework" VLCKit-lgpl.xcframework.zip
          mv "$RUNNER_TEMP/vlckit-lgpl/dist" dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vlckit-lgpl
          path: VLCKit-lgpl.xcframework.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vlckit-lgpl-licenses-and-source
          path: dist/
          if-no-files-found: error

  test:
    name: Unit tests with it
    needs: build
    runs-on: macos-15
    outputs:
      tree: ${{ steps.place.outputs.tree }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: Scripts/select_xcode.sh

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vlckit-lgpl

      - name: Put it in place
        id: place
        run: |
          mkdir -p Vendor
          ditto -x -k VLCKit-lgpl.xcframework.zip Vendor
          python3 -I Scripts/vlckit_licenses.py "$(find Vendor/VLCKit.xcframework -path '*VLCKit.framework/Versions/A/VLCKit' -type f | head -1)" --no-gpl --local-only
          # The tree SHA-256 fetch_vlckit.sh pins (TREE_SHA256), of the framework as unpacked from the zip
          source Scripts/fetch_verified.sh
          echo "tree=$(tree_sha256 Vendor/VLCKit.xcframework)" >> "$GITHUB_OUTPUT"

      - name: Test
        env:
          SCHNELLBILD_OWN_VLCKIT: "1"
        run: mkdir -p build && ./Scripts/test.sh

  publish:
    name: Publish it (pre-release)
    needs: [build, test]
    if: inputs.publish
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vlckit-lgpl

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vlckit-lgpl-licenses-and-source
          path: dist

      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ needs.test.outputs.tree }}
          VLCKIT: ${{ needs.build.outputs.vlckit }}
          VLCKIT_COMMIT: ${{ needs.build.outputs.vlckit_commit }}
          VLC: ${{ needs.build.outputs.vlc }}
          VLC_COMMIT: ${{ needs.build.outputs.vlc_commit }}
        run: |
          [ -n "$VLCKIT" ] && [ -n "$VLC" ] || { echo "!! the build job named no versions" >&2; exit 1; }
          SHA=$(shasum -a 256 VLCKit-lgpl.xcframework.zip | cut -d' ' -f1)
          TAG="vlckit-$VLCKIT-lgpl-$GITHUB_RUN_NUMBER"
          SUMS=$(cd dist && shasum -a 256 * | sed 's/^/    /')
          cat > notes.md <<NOTES
          VLCKit $VLCKIT (VideoLAN, tag $VLCKIT, commit ${VLCKIT_COMMIT:0:8}; VLC $VLC, commit ${VLC_COMMIT:0:8}) for macOS on Apple silicon, built without VLC's modules under the GPL and without the modules a viewer of local files never needs (network access, stream output, service discovery, playlists and adaptive streaming, stream filters that start programs or fetch, keystores; the list is in the build script), for Schnellbild. Not a Schnellbild release.

          Built by [Scripts/build_vlckit_lgpl.sh](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/Scripts/build_vlckit_lgpl.sh) at commit $GITHUB_SHA, in [run $GITHUB_RUN_ID](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Every VLC module is under the GNU LGPL 2.1 or later; the third-party libraries compiled into it (FFmpeg and others) keep their own licences, whose texts are in VLCKit-third-party-licenses.txt, and none of their code in it is under the GPL (libzvbi and FFmpeg's AArch64 files under the GPL are left out; Scripts/vlckit_contrib.py checks every object linked). The complete source it was built from is attached: VLCKit at the tag (with the build script change as a patch), VLC with VLCKit's patches applied, Schnellbild's own changes to VLC applied on top of it (VLC-schnellbild-changes.patch), the third-party libraries' downloads (VLCKit-contrib-sources.tar) and the build tools' downloads (VLC-tools-sources.tar). See THIRD-PARTY-NOTICES.md.

          SHA-256 of VLCKit-lgpl.xcframework.zip (fetch_vlckit.sh SHA256): \`$SHA\`
          Tree SHA-256 of the unpacked VLCKit.xcframework (fetch_vlckit.sh TREE_SHA256): \`$TREE\`

          SHA-256 of the other files:

          $SUMS
          NOTES
          gh release create "$TAG" VLCKit-lgpl.xcframework.zip dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "VLCKit $VLCKIT without GPL modules (build $GITHUB_RUN_NUMBER)" --notes-file notes.md
          echo "Published $TAG, SHA-256 $SHA, tree SHA-256 $TREE"
