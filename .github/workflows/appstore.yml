# The Mac App Store package (started by hand): the same app as the DMG
# (Scripts/build_app.sh), signed for the App Store and wrapped in its installer
# package. Signed when the App Store secrets are there (APPSTORE_APP_P12,
# APPSTORE_INSTALLER_P12, APPSTORE_CERT_PASSWORD, APPSTORE_PROFILE_APP,
# APPSTORE_PROFILE_THUMBNAILS, APPSTORE_PROFILE_FORMATREADER in the environment
# "release"), else ad hoc and unsigned, as a dry run. The package is an
# artifact; with "upload" it also goes to App Store Connect with the API key the
# DMG is notarized with (NOTARY_KEY_*), where it shows as a build of its version.
# With "metadata" Scripts/appstore_connect.swift puts AppStore/metadata and the
# screenshots into the version (and with "upload" picks the build); it uses an
# App Manager key (APPSTORE_API_KEY_P8 / _ID) if there is one (docs/SIGNING.md).
name: App Store

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the signed package to App Store Connect (TestFlight / review)"
        type: boolean
        default: false
      metadata:
        description: "Put texts and screenshots (AppStore/metadata) into App Store Connect; with upload also pick the build"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: App Store build and package
    if: inputs.upload || !inputs.metadata
    runs-on: macos-15
    # The certificates and profiles are secrets of the environment "release"
    # (only main and tags v*), like the Developer ID's.
    environment: release
    env:
      SIGN: ${{ secrets.APPSTORE_APP_P12 != '' && secrets.APPSTORE_INSTALLER_P12 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Set up the App Store certificates
        if: env.SIGN == 'true'
        env:
          APP_P12: ${{ secrets.APPSTORE_APP_P12 }}
          INSTALLER_P12: ${{ secrets.APPSTORE_INSTALLER_P12 }}
          P12_PASSWORD: ${{ secrets.APPSTORE_CERT_PASSWORD }}
        run: ./Scripts/macos-signing.sh appstore

      - name: Build, signed for the App Store
        env:
          PROFILE_APP: ${{ secrets.APPSTORE_PROFILE_APP }}
          PROFILE_THUMBNAILS: ${{ secrets.APPSTORE_PROFILE_THUMBNAILS }}
          PROFILE_FORMATREADER: ${{ secrets.APPSTORE_PROFILE_FORMATREADER }}
        run: |
          if [ "$SIGN" = true ]; then
            printf '%s' "$PROFILE_APP" | base64 --decode > "$RUNNER_TEMP/app.provisionprofile"
            printf '%s' "$PROFILE_THUMBNAILS" | base64 --decode > "$RUNNER_TEMP/thumbnails.provisionprofile"
            printf '%s' "$PROFILE_FORMATREADER" | base64 --decode > "$RUNNER_TEMP/formats.provisionprofile"
            export APP_PROFILE="$RUNNER_TEMP/app.provisionprofile"
            export THUMBNAILS_PROFILE="$RUNNER_TEMP/thumbnails.provisionprofile"
            export FORMATS_PROFILE="$RUNNER_TEMP/formats.provisionprofile"
          fi
          ./Scripts/build_app.sh

      - name: Installer package
        run: ./Scripts/package_appstore.sh build/Schnellbild.app build/Schnellbild.pkg

      - name: Upload to App Store Connect
        if: inputs.upload && env.SIGN == 'true'
        env:
          P8: ${{ secrets.NOTARY_KEY_P8 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        # --upload-package names the app (its Apple ID from app.json) and the
        # build; the versions are the app's own (Resources/Info.plist).
        run: |
          [[ "$KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "Unexpected key ID" >&2; exit 1; }
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          (umask 077; mkdir -p "$API_PRIVATE_KEYS_DIR"; printf '%s\n' "$P8" > "$API_PRIVATE_KEYS_DIR/AuthKey_$KEY_ID.p8")
          apple_id="$(plutil -extract appleId raw -o - AppStore/metadata/app.json)"
          bundle_id="$(plutil -extract bundleId raw -o - AppStore/metadata/app.json)"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/Schnellbild.app/Contents/Info.plist)"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' build/Schnellbild.app/Contents/Info.plist)"
          xcrun altool --upload-package build/Schnellbild.pkg --type macos \
            --apple-id "$apple_id" --bundle-id "$bundle_id" \
            --bundle-short-version-string "$version" --bundle-version "$build" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER" --output-format normal

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"

      - name: Remove signing data
        if: always() && env.SIGN == 'true'
        run: ./Scripts/macos-signing.sh cleanup

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appstore-package
          path: build/Schnellbild.pkg
          if-no-files-found: error

  metadata:
    name: Texts and screenshots to App Store Connect
    needs: package
    if: always() && inputs.metadata && (needs.package.result == 'success' || needs.package.result == 'skipped')
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Texts, screenshots, URLs, categories, review notes${{ inputs.upload && ', build' || '' }}
        env:
          # An App Manager key if there is one, else the notarization key.
          P8: ${{ secrets.APPSTORE_API_KEY_P8 || secrets.NOTARY_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID || secrets.NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          ASC_REVIEW_CONTACT: ${{ secrets.APPSTORE_REVIEW_CONTACT }}
          PICK_BUILD: ${{ inputs.upload }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/asc.p8"
          (umask 077; printf '%s\n' "$P8" > "$ASC_KEY_PATH")
          if [ "$PICK_BUILD" = true ]; then
            swift Scripts/appstore_connect.swift metadata --build
          else
            swift Scripts/appstore_connect.swift metadata
          fi

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
