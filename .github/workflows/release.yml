# Builds, tests and publishes a release for a version tag (e.g. v0.3.0).
#
# With the Apple secrets (environment "release": tags v* and main only) the app
# is signed with the Developer ID, packed into a DMG and submitted to Apple for
# notarization without waiting; the DMG is kept as artifact "macos-signed".
# mac-release.yml attaches it to the release as soon as Apple accepts it —
# after minutes or days. A tag build fails without the secrets: a release is
# always signed and notarized. Started by hand on a branch without them, the
# DMG is ad-hoc signed and kept as artifact "macos" (no release).
name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, sign & submit
    runs-on: macos-15
    environment: release
    # Build provenance (GitHub artifact attestations): signed by GitHub, so anyone
    # can check that a DMG or app came from this workflow at this commit
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    env:
      SIGN: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - name: A release needs the signing secrets
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGN != 'true'
        run: |
          echo "::error::The signing secrets are missing (environment release): a tag is never published ad-hoc signed"
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Cache VLCKit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Vendor
          key: vendor-${{ hashFiles('Scripts/fetch_vlckit.sh', 'Scripts/fetch_unrar.sh') }}

      - name: Fetch VLCKit
        run: ./Scripts/fetch_vlckit.sh

      - name: Test
        run: ./Scripts/test.sh

      - name: Set up signing certificate
        id: sign
        if: env.SIGN == 'true'
        env:
          P12: ${{ secrets.MACOS_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          ./Scripts/macos-signing.sh setup
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build app bundle (release)
        env:
          # The media extension's provisioning profile (its entitlement needs it)
          PROFILE: ${{ secrets.MACOS_PROFILE_FORMATREADER }}
        run: |
          if [ -n "$PROFILE" ]; then
            printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/formats.provisionprofile"
            export FORMATS_PROFILE="$RUNNER_TEMP/formats.provisionprofile"
          fi
          ./Scripts/build_app.sh

      - name: Check the signature
        run: |
          codesign --verify --strict --deep --verbose=2 build/Schnellbild.app
          codesign -dvv build/Schnellbild.app 2>&1 | grep -E 'Authority|TeamIdentifier|flags' || true

      - name: Install dmgbuild (pinned, hash-checked)
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --require-hashes --only-binary :all: -r Installer/requirements.txt
          echo "$RUNNER_TEMP/dmgbuild/bin" >> "$GITHUB_PATH"

      - name: Build DMG (unsigned)
        if: env.SIGN != 'true'
        run: ./Scripts/package_dmg.sh dmg

      - name: Build DMG and submit to Apple
        if: env.SIGN == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./Scripts/package_dmg.sh submit

      - name: Remove signing data
        if: always() && env.SIGN == 'true'
        run: ./Scripts/macos-signing.sh cleanup

      # The app's executable keeps its hash in the DMG and after installing
      # (stapling changes only the DMG), so the installed app can be checked too;
      # the DMG as submitted to Apple here, the stapled one in mac-release.yml
      - name: Attest where the app and the DMG come from
        if: env.SIGN == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            build/Schnellbild.app/Contents/MacOS/Schnellbild
            dist/signed/Schnellbild.dmg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.SIGN != 'true'
        with:
          name: macos
          path: dist/Schnellbild.dmg
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.SIGN == 'true'
        with:
          name: macos-signed
          path: dist/signed/
          retention-days: 90
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          [ "$SIGNED" = true ] || { echo "::error::not signed: no release"; exit 1; }
          notes="The notarized DMG is attached as soon as Apple has checked it (usually minutes)."
          # Not "Latest" until the DMG is attached (Finish Mac release marks
          # it), so releases/latest/download/Schnellbild.dmg keeps working
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
              --generate-notes --notes "$notes" --latest=false
          fi
