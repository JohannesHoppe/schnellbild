# Takes the README screenshots on a clean Mac (started by hand):
# Scripts/make_sample_media.swift draws a sample library (photos and videos), the
# ReadmeScreenshots UI test opens the app on it and walks through its views,
# in light and dark mode; Scripts/shoot_window.swift photographs the window
# with its shadow. The PNGs land in the artifact "screenshots"; copy them to
# docs/screenshots.
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Cache VLCKit
        uses: actions/cache@v4
        with:
          path: Vendor
          key: vlckit-${{ hashFiles('Scripts/fetch_vlckit.sh') }}

      - name: Fetch VLCKit
        run: ./Scripts/fetch_vlckit.sh

      - name: Build for testing
        run: |
          xcodegen generate
          xcodebuild build-for-testing -project Schnellbild.xcodeproj -scheme Schnellbild \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData

      - name: Draw the sample media
        run: swift Scripts/make_sample_media.swift /Users/Shared/Photos

      - name: Build the window photographer
        run: swiftc -O Scripts/shoot_window.swift -o build/shoot_window

      - name: Hide the Dock
        # The runner's screen is small; the Dock would cover the window's bottom.
        run: |
          defaults write com.apple.dock autohide -bool true
          defaults write com.apple.dock autohide-delay -float 1000
          killall Dock
          sleep 2

      - name: Take the screenshots
        run: |
          mkdir -p shots
          # The test asks for each picture on the pasteboard ("shoot:<name>")
          # and waits for "done:<name>".
          (
            while :; do
              request=$(pbpaste 2>/dev/null || true)
              case "$request" in
                shoot:*)
                  name=${request#shoot:}
                  echo "== $name"
                  tmp=$(mktemp -d)
                  read -r id rect < <(build/shoot_window window)
                  screencapture -x -l "$id" "$tmp/shadow.png"
                  screencapture -x -o -l "$id" "$tmp/flat.png"
                  screencapture -x -R "$rect" "$tmp/screen.png"
                  build/shoot_window compose "shots/$name.png" "$tmp" || true
                  rm -rf "$tmp"
                  printf 'done:%s' "$name" | pbcopy
                  ;;
              esac
              sleep 0.2
            done
          ) &
          helper=$!
          set_dark() {
            osascript -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $1"
          }
          status=0
          for mode in light dark; do
            set_dark "$([ "$mode" = dark ] && echo true || echo false)"
            TEST_RUNNER_SCREENSHOTS=1 TEST_RUNNER_SCREENSHOT_SUFFIX="-$mode" TEST_RUNNER_PHOTOS_DIR=/Users/Shared/Photos \
              xcodebuild test-without-building -project Schnellbild.xcodeproj -scheme Schnellbild \
                -destination 'platform=macOS' -derivedDataPath build/DerivedData \
                -only-testing:SchnellbildUITests/ReadmeScreenshots || status=1
          done
          kill "$helper"
          ls -la shots
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png
          if-no-files-found: error
