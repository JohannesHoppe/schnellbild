# Takes the README and website screenshots on a clean Mac (started by hand):
# Scripts/make_sample_media.swift draws a sample library (photos and videos), the
# ReadmeScreenshots UI test opens the app on it and walks through its views,
# in light and dark mode; Scripts/shoot_window.swift photographs the window
# with its shadow. The input language is one of the app's languages (a folder
# of Resources/Localization without ".lproj", the website's code: de, pt-BR,
# zh-Hans …) or "all", one job per language side by side. English pictures
# are named <name>-light / -dark (README), the others <name>-light-<lang> /
# -dark-<lang> (website); each language's PNGs land in the artifact
# "screenshots-<lang>". `python3 Scripts/make_site_images.py import <folders>`
# puts them into docs/screenshots as lossless WebP (the repository holds no
# screenshot PNGs).
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      language:
        description: "The app's language (en, de, fr, pt-BR, zh-Hans …: a folder of Resources/Localization) or all"
        default: en
      test:
        description: "The screenshot test to run (ReadmeScreenshots, or one of its tests, e.g. ReadmeScreenshots/testAtlasScreenshots)"
        default: ReadmeScreenshots

permissions:
  contents: read

jobs:
  languages:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: Resources/Localization

      - name: Pick the languages
        id: pick
        env:
          LANGUAGE_INPUT: ${{ inputs.language }}
        run: |
          all=$(cd Resources/Localization && ls -d *.lproj | sed 's/\.lproj$//')
          language="${LANGUAGE_INPUT:-en}"
          if [ "$language" = all ]; then
            picked=$all
          elif printf '%s\n' $all | grep -qxF -- "$language"; then
            picked=$language
          else
            echo "unknown language $language (one of: $(echo $all) or all)"; exit 1
          fi
          list=$(printf '%s\n' $picked | jq -R . | jq -cs .)
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "$list"

  # The app as it ships (build_app.sh + sign_app.sh, ad hoc), once for every
  # language: the screenshots show the app in the App Sandbox exactly as
  # users get it. An Xcode build for testing gets Xcode's own exceptions on
  # top of its entitlements (read-only access to the whole disk). The UI
  # tests are built here too, once: the language only enters when they run.
  app:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: Scripts/select_xcode.sh

      - name: Cache Vendor
        uses: ./.github/actions/vendor-cache

      - name: Build the app
        run: |
          ./Scripts/build_app.sh
          ./Scripts/check_entitlements.sh build/Schnellbild.app
          ditto -c -k --keepParent build/Schnellbild.app build/Schnellbild.app.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Schnellbild-app
          path: build/Schnellbild.app.zip
          if-no-files-found: error

      - name: Install xcodegen
        run: ./Scripts/fetch_xcodegen.sh >> "$GITHUB_PATH"

      # The products with their .xctestrun, which names them relative to its
      # own folder: the screenshot jobs run them with test-without-building
      - name: Build the UI tests
        run: |
          xcodegen generate
          xcodebuild build-for-testing -project Schnellbild.xcodeproj -scheme Schnellbild \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData
          ls build/DerivedData/Build/Products/*.xctestrun
          ditto -c -k --keepParent build/DerivedData/Build/Products build/Products.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Schnellbild-uitests
          path: build/Products.zip
          if-no-files-found: error

  screenshots:
    needs: [languages, app]
    runs-on: macos-15
    permissions:
      contents: read
      actions: read            # the app from this run's artifacts
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.languages.outputs.list) }}
    name: screenshots (${{ matrix.language }})
    # A few minutes a language; a hang ends here, not at GitHub's six hours
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: Scripts/select_xcode.sh

      - name: Get the app and the UI tests (built by the app job)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name Schnellbild-app --dir build/shipped
          ditto -x -k build/shipped/Schnellbild.app.zip build/shipped
          ./Scripts/check_entitlements.sh build/shipped/Schnellbild.app
          gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name Schnellbild-uitests --dir build
          ditto -x -k build/Products.zip build
          ls build/Products/*.xctestrun

      - name: Draw the sample media
        run: swift Scripts/make_sample_media.swift /Users/Shared/Photos

      # Made here: the UI-test runner may not write into the library. Two
      # archives (one with a password) from the photos sorted by path, as
      # ReadmeScreenshots expects them, and two files the app doesn't show.
      - name: Archives and other files for the screenshots
        working-directory: /Users/Shared/Photos
        run: |
          photos=()
          while IFS= read -r f; do photos+=("$f"); done < <(find . -name '*.jpg' -not -path './.*' | sed 's|^\./||' | LC_ALL=C sort)
          zip -q -0 -j "Iceland 2025.zip" "${photos[@]:0:6}"
          zip -q -0 -j -P secret "Private.zip" "${photos[@]: -2}"
          printf 'Rain jacket, tripod, spare batteries\n' > "Packing list.txt"
          printf '<gpx/>\n' > Route.gpx

      # Real photographs (CC0 and public domain, Scripts/build_world_photos.py)
      # from places around the Mediterranean and beyond: the Atlas view's
      # globe with its photo pins. A folder of their own, so the archives
      # above keep their photos.
      - name: The world trip for the Atlas globe
        run: ./Scripts/fetch_world_photos.sh /Users/Shared/World

      - name: Build the window photographer
        run: swiftc -O Scripts/shoot_window.swift -o build/shoot_window

      - name: Hide the Dock
        run: ./Scripts/hide_dock.sh

      - name: Take the screenshots
        timeout-minutes: 45
        env:
          LANGUAGE_INPUT: ${{ matrix.language }}
          TEST_INPUT: ${{ inputs.test }}
        run: |
          mkdir -p shots
          # The test asks for each picture on the pasteboard ("shoot:<name>")
          # and waits for "done:<name>"; a picture that couldn't be taken is
          # answered "failed:<name>", which fails the test, and fails this
          # step too
          source Scripts/pasteboard_requests.sh
          handle() {
            case "$1" in
              shoot:*|shoot-front:*)
                # shoot-front: the frontmost window (Settings), else the main one
                local which= name=${1#*:} tmp id rect
                [ "${1%%:*}" = shoot-front ] && which=front
                echo "== $name"
                tmp=$(mktemp -d)
                if read -r id rect < <(build/shoot_window window $which) \
                   && screencapture -x -l "$id" "$tmp/shadow.png" \
                   && screencapture -x -o -l "$id" "$tmp/flat.png" \
                   && screencapture -x -R "$rect" "$tmp/screen.png" \
                   && build/shoot_window compose "shots/$name.png" "$tmp"; then
                  answer "done:$name"
                else
                  echo "!! $name couldn't be taken"
                  echo "$name" >> shots-failed.txt
                  answer "failed:$name"
                fi
                rm -rf "$tmp"
                ;;
            esac
          }
          serve_requests handle
          set_dark() {
            osascript -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $1"
          }
          status=0
          language="$LANGUAGE_INPUT"
          modes="light dark"; tag=""
          [ "$language" = en ] || tag="-$language"
          xctestrun=$(ls build/Products/*.xctestrun | head -n 1)
          for mode in $modes; do
            set_dark "$([ "$mode" = dark ] && echo true || echo false)"
            # Same window size and place in both runs: forget the saved frame
            defaults delete art.haushoppe.schnellbild 2>/dev/null || true
            TEST_RUNNER_SCHNELLBILD_APP="$PWD/build/shipped/Schnellbild.app" TEST_RUNNER_SCREENSHOTS=1 TEST_RUNNER_SCREENSHOT_SUFFIX="-$mode$tag" TEST_RUNNER_LANGUAGE="$language" TEST_RUNNER_PHOTOS_DIR=/Users/Shared/Photos TEST_RUNNER_WORLD_DIR=/Users/Shared/World \
              xcodebuild test-without-building -xctestrun "$xctestrun" -destination 'platform=macOS' \
                -only-testing:"SchnellbildUITests/${TEST_INPUT:-ReadmeScreenshots}" || status=1
          done
          stop_serving
          ls -la shots
          if [ -s shots-failed.txt ]; then
            echo "Pictures that couldn't be taken:"; cat shots-failed.txt; status=1
          fi
          exit $status

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-${{ matrix.language }}
          path: shots/*.png
          if-no-files-found: error
