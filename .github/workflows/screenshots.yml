# Takes the README screenshots on a clean Mac (started by hand):
# Scripts/make_sample_media.swift draws a sample library (photos and videos), the
# ReadmeScreenshots UI test opens the app on it and walks through its views,
# in light and dark mode; Scripts/shoot_window.swift photographs the window
# with its shadow. The PNGs land in the artifact "screenshots"; copy them to
# docs/screenshots.
name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: ./Scripts/fetch_xcodegen.sh >> "$GITHUB_PATH"

      - name: Cache VLCKit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Vendor
          key: vendor-${{ hashFiles('Scripts/fetch_vlckit.sh', 'Scripts/fetch_unrar.sh') }}

      - name: Fetch VLCKit
        run: ./Scripts/fetch_vlckit.sh

      - name: Build for testing
        run: |
          xcodegen generate
          xcodebuild build-for-testing -project Schnellbild.xcodeproj -scheme Schnellbild \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData

      - name: Draw the sample media
        run: swift Scripts/make_sample_media.swift /Users/Shared/Photos

      # Made here: the UI-test runner may not write into the library. Two
      # archives (one with a password) from the photos sorted by path, as
      # ReadmeScreenshots expects them, and two files the app doesn't show.
      - name: Archives and other files for the screenshots
        working-directory: /Users/Shared/Photos
        run: |
          photos=()
          while IFS= read -r f; do photos+=("$f"); done < <(find . -name '*.jpg' -not -path './.*' | sed 's|^\./||' | LC_ALL=C sort)
          zip -q -0 -j "Iceland 2025.zip" "${photos[@]:0:6}"
          zip -q -0 -j -P secret "Private.zip" "${photos[@]: -2}"
          printf 'Rain jacket, tripod, spare batteries\n' > "Packing list.txt"
          printf '<gpx/>\n' > Route.gpx

      - name: Build the window photographer
        run: swiftc -O Scripts/shoot_window.swift -o build/shoot_window

      - name: Hide the Dock
        # The runner's screen is small; the Dock would cover the window's bottom.
        run: |
          defaults write com.apple.dock autohide -bool true
          defaults write com.apple.dock autohide-delay -float 1000
          killall Dock
          sleep 2

      - name: Take the screenshots
        run: |
          mkdir -p shots
          # The test asks for each picture on the pasteboard ("shoot:<name>")
          # and waits for "done:<name>".
          (
            # One failed capture must not end the helper (the step runs with -e)
            set +e
            while :; do
              request=$(pbpaste 2>/dev/null || true)
              case "$request" in
                shoot:*)
                  name=${request#shoot:}
                  echo "== $name"
                  tmp=$(mktemp -d)
                  read -r id rect < <(build/shoot_window window)
                  screencapture -x -l "$id" "$tmp/shadow.png"
                  screencapture -x -o -l "$id" "$tmp/flat.png"
                  screencapture -x -R "$rect" "$tmp/screen.png"
                  build/shoot_window compose "shots/$name.png" "$tmp" || true
                  rm -rf "$tmp"
                  printf 'done:%s' "$name" | pbcopy
                  ;;
              esac
              sleep 0.2
            done
          ) &
          helper=$!
          set_dark() {
            osascript -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $1"
          }
          status=0
          for mode in light dark; do
            set_dark "$([ "$mode" = dark ] && echo true || echo false)"
            # Same window size and place in both runs: forget the saved frame
            defaults delete art.haushoppe.schnellbild 2>/dev/null || true
            TEST_RUNNER_SCREENSHOTS=1 TEST_RUNNER_SCREENSHOT_SUFFIX="-$mode" TEST_RUNNER_PHOTOS_DIR=/Users/Shared/Photos \
              xcodebuild test-without-building -project Schnellbild.xcodeproj -scheme Schnellbild \
                -destination 'platform=macOS' -derivedDataPath build/DerivedData \
                -only-testing:SchnellbildUITests/ReadmeScreenshots || status=1
          done
          kill "$helper" 2>/dev/null || true
          ls -la shots
          exit $status

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots
          path: shots/*.png
          if-no-files-found: error
