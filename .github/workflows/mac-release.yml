# Attaches the DMG to the release once Apple has notarized it. The release
# workflow already submitted the signed DMG and kept it as artifact
# "macos-signed" (DMG + submission ID).
#
# Runs right after every release build, every 30 minutes (while a release lacks
# its DMG) and by hand. If Apple is still checking, the run ends green and the
# next one asks again. If Apple rejects it, the artifact is deleted so it isn't
# asked about forever. Every run then makes the newest app release with its
# DMG "Latest", so a step that failed after the upload is made good by the next
# run.
name: Finish Mac release

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    # A tag build, or a build started by hand on main (find checks it again)
    branches: [main, 'v*']
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Release build run (number); empty = newest release without DMG"
        required: false

permissions:
  contents: read

jobs:
  find:
    # Only our own builds from tags or manual starts, never from pull requests of forks
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      artifact_id: ${{ steps.find.outputs.artifact_id }}
      sha: ${{ steps.find.outputs.sha }}
      tag: ${{ steps.find.outputs.tag }}
    steps:
      # Only the filter that lists the releases without their DMG
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: Scripts/unfinished_releases.jq
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # Every lookup is an assignment, which ends the step red when gh fails:
      # a failed lookup never reads as "nothing to do" or "no DMG yet"
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          EVENT_RUN: ${{ github.event.workflow_run.id }}
          INPUT_RUN: ${{ inputs.run_id }}
        run: |
          # ID of a run's unexpired artifact "macos-signed" (or empty)
          signed_artifact() {
            gh api "repos/$R/actions/runs/$1/artifacts" \
              -q '[.artifacts[] | select(.name == "macos-signed" and (.expired | not)) | .id][0] // empty'
          }
          RUN="${EVENT_RUN:-$INPUT_RUN}"
          RUN=$(printf '%s' "$RUN" | tr -d '[:space:]')
          if [ -n "$RUN" ] && ! [[ "$RUN" =~ ^[0-9]+$ ]]; then
            echo "The build run must be a number" >&2; exit 1
          fi
          if [ -z "$RUN" ]; then
            # Newest app release without DMG (every page of the list: data and
            # VLCKit pre-releases may be many), and its newest build with a submitted DMG
            releases=$(gh api --paginate "repos/$R/releases?per_page=100")
            unfinished=$(printf '%s\n' "$releases" | jq -r -f Scripts/unfinished_releases.jq)
            for t in $unfinished; do
              # Pushed tags and runs started by hand on the tag alike
              ids=$(gh run list -R "$R" -w release.yml -b "$t" -L 10 --json databaseId -q '.[].databaseId')
              for id in $ids; do
                art=$(signed_artifact "$id")
                if [ -n "$art" ]; then RUN=$id; break; fi
              done
              if [ -n "$RUN" ]; then break; fi
            done
            if [ -z "$RUN" ]; then echo "Nothing to do"; exit 0; fi
          fi
          ART=$(signed_artifact "$RUN")
          if [ -z "$ART" ]; then echo "Run $RUN has no submitted DMG - nothing to do"; exit 0; fi
          run=$(gh api "repos/$R/actions/runs/$RUN" \
            -q '[.head_repository.full_name, .event, .head_branch, .head_sha] | @tsv')
          IFS=$'\t' read -r repo event branch sha <<< "$run"
          if [ "$repo" != "$R" ]; then echo "Foreign run" >&2; exit 1; fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Unexpected commit: $sha" >&2; exit 1; }
          if [ "$event" != push ] && [ "$event" != workflow_dispatch ]; then
            echo "Run $RUN was started by $event" >&2; exit 1
          fi
          # finish runs this commit's scripts with the notary key: only a commit
          # of a release tag (the DMG goes to that release) or of main (started
          # by hand there: the DMG only as artifact)
          TAG=""
          if [[ "$branch" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            refs=$(git ls-remote "https://github.com/$R" "refs/tags/$branch" "refs/tags/$branch^{}")
            # An annotated tag lists the commit it points at as <tag>^{}
            tagged=$(printf '%s\n' "$refs" | awk -v t="refs/tags/$branch" '$2 == t "^{}" { print $1; f = 1 } $2 == t { c = $1 } END { if (!f) print c }')
            if [ "$tagged" != "$sha" ]; then
              echo "Run $RUN built $sha, but tag $branch points at '${tagged:-nothing}'" >&2; exit 1
            fi
            TAG=$branch
            assets=$(gh release view "$TAG" -R "$R" --json assets -q '.assets[].name')
            if printf '%s\n' "$assets" | grep -qx 'Schnellbild.dmg'; then echo "$TAG already has a DMG"; exit 0; fi
          elif [ "$branch" = main ]; then
            # GitHub's comparison main...<sha> is "identical" or "behind" when
            # main contains the commit
            status=$(gh api "repos/$R/compare/main...$sha" -q .status)
            if [ "$status" != identical ] && [ "$status" != behind ]; then
              echo "Run $RUN built $sha, which isn't on main ($status)" >&2; exit 1
            fi
          else
            echo "Run $RUN was built from $branch, neither main nor a release tag" >&2; exit 1
          fi
          echo "Build run $RUN, commit $sha${TAG:+, release $TAG}"
          {
            echo "run_id=$RUN"
            echo "artifact_id=$ART"
            echo "sha=$sha"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

  finish:
    needs: find
    if: needs.find.outputs.run_id != ''
    runs-on: macos-15
    environment: release
    timeout-minutes: 60
    # One finish per release at a time (two builds of one tag both submit a
    # DMG: the second waits and then finds the first one's attached); a build
    # on main per run
    concurrency:
      group: mac-release-${{ needs.find.outputs.tag || needs.find.outputs.run_id }}
    permissions:
      actions: write
      contents: write
      # Build provenance of the stapled DMG (see release.yml)
      id-token: write
      attestations: write
    # The token only in the steps that call gh, not in the scripts the
    # checked-out commit brings
    env:
      RUN_ID: ${{ needs.find.outputs.run_id }}
      ARTIFACT_ID: ${{ needs.find.outputs.artifact_id }}
      TAG: ${{ needs.find.outputs.tag }}
      MACOS_TEAM_ID: 87884AP46G
    steps:
      # Scripts from the same commit as the submitted DMG
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.find.outputs.sha }}
          persist-credentials: false
      # Another finish (queued behind this one's group) may have attached it
      # since find looked; a failed lookup ends the job red
      - name: Check the release still lacks the DMG
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$TAG" ]; then
            assets=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
            if printf '%s\n' "$assets" | grep -qx 'Schnellbild.dmg'; then
              echo "$TAG already has a DMG"
              echo "done=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Select Xcode
        if: steps.check.outputs.done != 'true'
        run: Scripts/select_xcode.sh
      - name: Fetch the submitted DMG
        if: steps.check.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n macos-signed -D dist/signed
      - name: Set up the Apple API key
        if: steps.check.outputs.done != 'true'
        env:
          P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: ./Scripts/macos-signing.sh notary-key
      - name: Ask Apple, staple the ticket
        if: steps.check.outputs.done != 'true'
        id: pkg
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          # Right after the build wait a while (it usually takes minutes);
          # the 30-minute schedule only asks once
          NOTARY_WAIT_MINUTES: ${{ github.event_name == 'schedule' && '0' || '30' }}
        run: ./Scripts/package_dmg.sh finish
      - name: Remove the key
        if: always()
        run: ./Scripts/macos-signing.sh cleanup
      - name: Stop retrying a rejected DMG
        if: failure() && steps.pkg.outputs.result == 'invalid'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
      - name: Attest where the stapled DMG comes from
        if: steps.pkg.outputs.result == 'accepted'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/Schnellbild.dmg
      - name: Attach the DMG to the release
        if: steps.pkg.outputs.result == 'accepted' && env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/Schnellbild.dmg
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.pkg.outputs.result == 'accepted' && env.TAG == ''
        with:
          name: macos-dmg
          path: dist/Schnellbild.dmg

  # The newest app release that has its DMG is "Latest" (each is created with
  # --latest=false, so releases/latest/download/Schnellbild.dmg never 404s).
  # Every run checks it, whatever find and finish did: a mark that failed
  # after the upload, or a newer release rejected by Apple, is put right here.
  latest:
    needs: [find, finish]
    if: always() && needs.find.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mac-release-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          # Newest first, as GitHub lists them; the app's releases are tagged
          # v<version> and are never pre-releases
          finished=$(gh api --paginate "repos/$R/releases?per_page=100" -q '.[]
            | select((.draft | not) and (.prerelease | not) and (.tag_name | test("^v[0-9]")))
            | select(any(.assets[]?; .name == "Schnellbild.dmg"))
            | .tag_name')
          newest=$(printf '%s\n' "$finished" | head -n 1)
          if [ -z "$newest" ]; then echo "No release has its DMG yet"; exit 0; fi
          latest=$(gh api "repos/$R/releases/latest" -q .tag_name)
          if [ "$latest" = "$newest" ]; then echo "$newest is Latest"; exit 0; fi
          echo "Latest: $newest (was ${latest:-none})"
          gh release edit "$newest" -R "$R" --latest
