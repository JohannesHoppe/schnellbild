name: CI

# Runs for a change to anything the build or the tests read. The last pattern
# a file matches decides; CIPathsTests checks the list against what the CI
# jobs run and what the tests read.
on:
  push:
    branches: [ main ]
    paths:
      - '**'
      # Texts, the website and the App Store's metadata
      - '!**.md'
      - '!docs/**'
      - '!site/**'
      - '!AppStore/**'
      - '!Spike/**'
      # Workflows other than this one
      - '!.github/workflows/**'
      - '.github/workflows/ci.yml'
      # Scripts that make the website, the screenshots, the demo video, Store
      # pictures and prices, the DMG window's picture or the map, globe and world-photo
      # data (shell scripts stay: BuildScriptsTests reads every one)
      - '!Scripts/build_site.py'
      - '!Scripts/site_alternatives.py'
      - '!Scripts/make_site_images.py'
      - '!Scripts/make_video_animation.py'
      - '!Scripts/make_sample_media.swift'
      - '!Scripts/shoot_window.swift'
      - '!Scripts/display_mode.swift'
      - '!Scripts/record_screen.swift'
      - '!Scripts/make_demo_video.py'
      - '!Scripts/make_store_screenshots.swift'
      - '!Scripts/appstore_connect.swift'
      - '!Scripts/make_dmg_background.swift'
      - '!Scripts/build_map_data.py'
      - '!Scripts/build_globe_data.py'
      - '!Scripts/_build_common.py'
      - '!Scripts/build_world_photos.py'
      - '!Scripts/world_photos.env'
      # The privacy policies the About window links (AboutPanelTests)
      - 'docs/privacy/index.html'
      - 'docs/de/datenschutz/index.html'
      - 'docs/*/privacy/index.html'
  pull_request:
    paths:
      - '**'
      # Texts, the website and the App Store's metadata
      - '!**.md'
      - '!docs/**'
      - '!site/**'
      - '!AppStore/**'
      - '!Spike/**'
      # Workflows other than this one
      - '!.github/workflows/**'
      - '.github/workflows/ci.yml'
      # Scripts that make the website, the screenshots, the demo video, Store
      # pictures and prices, the DMG window's picture or the map, globe and world-photo
      # data (shell scripts stay: BuildScriptsTests reads every one)
      - '!Scripts/build_site.py'
      - '!Scripts/site_alternatives.py'
      - '!Scripts/make_site_images.py'
      - '!Scripts/make_video_animation.py'
      - '!Scripts/make_sample_media.swift'
      - '!Scripts/shoot_window.swift'
      - '!Scripts/display_mode.swift'
      - '!Scripts/record_screen.swift'
      - '!Scripts/make_demo_video.py'
      - '!Scripts/make_store_screenshots.swift'
      - '!Scripts/appstore_connect.swift'
      - '!Scripts/make_dmg_background.swift'
      - '!Scripts/build_map_data.py'
      - '!Scripts/build_globe_data.py'
      - '!Scripts/_build_common.py'
      - '!Scripts/build_world_photos.py'
      - '!Scripts/world_photos.env'
      # The privacy policies the About window links (AboutPanelTests)
      - 'docs/privacy/index.html'
      - 'docs/de/datenschutz/index.html'
      - 'docs/*/privacy/index.html'
  workflow_dispatch:
    inputs:
      only:
        description: "UI tests to run (xcodebuild -only-testing; several separated by commas), e.g. SchnellbildUITests/VisualUITests"
        required: false
        default: SchnellbildUITests
      macos:
        description: "Run the UI tests on this runner image only, e.g. macos-26 (empty: macos-15 and macos-26)"
        required: false
        default: ""
      repeat:
        description: "Run each selected UI test up to this many times, until one fails (to catch a rare failure); empty: once"
        required: false
        default: ""
      unit:
        description: "Instead of the full run: only these unit tests (swift test --filter), on macos-15 and macos-26, repeat times until one fails"
        required: false
        default: ""

# Reads the repository; writes nothing to it
permissions:
  contents: read

# A newer push cancels an older one; a run started by hand (a few UI tests)
# has its own group, so it never cancels the full run of a push.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test & package
    if: ${{ !inputs.unit }}
    runs-on: macos-15          # GitHub-hosted macOS runner — ships Xcode preinstalled
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: Scripts/select_xcode.sh

      # The checks that keep code under the GPL out of VLCKit
      # (vlckit_licenses.py, vlckit_contrib.py)
      - name: Tests of the VLCKit licence checks
        run: python3 -I -m unittest discover -s Scripts/tests -v

      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Cache VLCKit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Vendor
          key: vendor-${{ hashFiles('Scripts/fetch_vlckit.sh', 'Scripts/fetch_unrar.sh', 'Scripts/fetch_map.sh', 'Scripts/map_data.env', 'Scripts/fetch_globe.sh', 'Scripts/globe_data.env') }}

      - name: Fetch VLCKit
        run: ./Scripts/fetch_vlckit.sh

      - name: Test
        # A hang ends the tests after 20 min, the hanging test named (Scripts/test.sh)
        timeout-minutes: 45
        env:
          CHEATSHEET_PDF: ${{ github.workspace }}/build/cheat-sheet.pdf
          # OfflineMapTests draws its sample views there (light and dark)
          MAP_SNAPSHOT_DIR: ${{ github.workspace }}/build/map-snapshots
          # FormatVisualTests: each format's sample decoded, contact sheets, the numbers
          FORMAT_SNAPSHOT_DIR: ${{ github.workspace }}/build/format-snapshots
        run: mkdir -p build && ./Scripts/test.sh

      - name: Keep the map's sample views
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: map-snapshots
          path: build/map-snapshots/*.png
          if-no-files-found: error

      - name: Keep the formats' pictures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: format-snapshots
          path: build/format-snapshots/
          if-no-files-found: error

      - name: Keep the printed cheat sheet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cheat-sheet
          path: build/cheat-sheet.pdf
          if-no-files-found: error

      - name: Build app bundle (release)
        run: ./Scripts/build_app.sh

      - name: Signed with exactly the shipped entitlements
        run: ./Scripts/check_entitlements.sh build/Schnellbild.app

      - name: Zip app
        run: ditto -c -k --keepParent build/Schnellbild.app build/Schnellbild.app.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Schnellbild-app
          path: build/Schnellbild.app.zip
          if-no-files-found: error

  thumbnail-extension:
    # The built app's QuickLook extension, asked by macOS for each format it
    # claims; which formats macOS keeps for its own extension differs by version
    name: Thumbnail extension (${{ matrix.os }})
    needs: build-test
    # A probe gives up after 60 s; the whole check takes a few minutes
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read            # the app from this run's artifacts
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Get the app (built by build-test in this run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name Schnellbild-app --dir build
          ditto -x -k build/Schnellbild.app.zip build

      - name: Each format through macOS
        run: ./Scripts/check_thumbnail_extension.sh build/Schnellbild.app

      - name: Keep the thumbnails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thumbnail-check-${{ matrix.os }}
          path: build/thumbnail-check/*.png
          if-no-files-found: ignore

  ui-tests:
    # Both macOS versions: AVKit's controls look and behave differently
    # from macOS 26 on (the inline ones dim the whole picture there).
    # The app under test is the bundle build-test made and signed as it
    # ships (build_app.sh + sign_app.sh, in the App Sandbox), not the Xcode
    # build; the tests open their folders to it through the open panel.
    name: UI tests (${{ matrix.os }})
    if: ${{ !inputs.unit }}
    needs: build-test
    permissions:
      contents: read
      actions: read            # the app from this run's artifacts
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && format('["{0}"]', inputs.macos) || '["macos-15", "macos-26"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: Scripts/select_xcode.sh

      - name: Cache xcodegen
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/xcodegen
          key: xcodegen-${{ hashFiles('Scripts/fetch_xcodegen.sh') }}

      - name: Install xcodegen
        run: ./Scripts/fetch_xcodegen.sh >> "$GITHUB_PATH"

      # A copy that changed after it was checked (a cache entry) isn't run:
      # it is fetched and checked again
      - name: A changed xcodegen is fetched again
        run: |
          printf 'changed' >> build/xcodegen/LICENSE
          ./Scripts/fetch_xcodegen.sh 2> build/xcodegen-refetch.log >/dev/null
          cat build/xcodegen-refetch.log
          grep -q 'Downloading XcodeGen' build/xcodegen-refetch.log

      - name: Cache VLCKit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Vendor
          key: vendor-${{ hashFiles('Scripts/fetch_vlckit.sh', 'Scripts/fetch_unrar.sh', 'Scripts/fetch_map.sh', 'Scripts/map_data.env', 'Scripts/fetch_globe.sh', 'Scripts/globe_data.env') }}

      - name: Fetch VLCKit
        run: ./Scripts/fetch_vlckit.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Get the app (built by build-test in this run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name Schnellbild-app --dir build/shipped
          ditto -x -k build/shipped/Schnellbild.app.zip build/shipped
          ./Scripts/check_entitlements.sh build/shipped/Schnellbild.app

      - name: Folders for the tests
        # Outside every container: the test runner may write them
        # (UITests/Runner.entitlements), the app reads them only once they
        # are opened to it. A disk image for another volume.
        run: |
          mkdir -p /Users/Shared/SchnellbildUITests ~/Pictures/SchnellbildUITests
          hdiutil create -size 64m -fs APFS -volname SchnellbildUITests -o build/uitests-volume.dmg
          hdiutil attach build/uitests-volume.dmg
          test -d /Volumes/SchnellbildUITests
          # The Dock hidden: on the runner's small screen it covers the
          # bottom of a tall window (Settings → Folder access)
          defaults write com.apple.dock autohide -bool true
          defaults write com.apple.dock autohide-delay -float 1000
          killall Dock
          sleep 2

      - name: Build the brightness meter
        run: mkdir -p build && swiftc -O Scripts/measure_brightness.swift -o build/measure_brightness

      - name: Run XCUITests
        env:
          ONLY: ${{ inputs.only || 'SchnellbildUITests' }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          # VisualUITests measure the screen through this shell, which may
          # record it: the test asks with "measure:<id>:<x>,<y>,<w>,<h>" on the
          # pasteboard and gets "measured:<id>:<mean luminance>:<std deviation>:<red>:<green>:<blue>" back;
          # "shot:<name>:<x>,<y>,<w>,<h>" keeps a picture of that region as measurements/<name>.png.
          mkdir -p measurements
          (
            # One failed capture must not end the helper (the step runs with -e)
            set +e
            while :; do
              request=$(pbpaste 2>/dev/null || true)
              case "$request" in
                measure:*)
                  rest=${request#measure:}
                  id=${rest%%:*}
                  rect=${rest#*:}
                  shot=measurements/$id-region.png
                  screencapture -x -R "$rect" "$shot"
                  screencapture -x "measurements/$id-screen.png"
                  read -r mean spread red green blue < <(build/measure_brightness "$shot" || echo "-1 -1 -1 -1 -1")
                  echo "== measure $id $rect: $mean ± $spread (RGB $red $green $blue)"
                  printf 'measured:%s:%s:%s:%s:%s:%s' "$id" "$mean" "$spread" "$red" "$green" "$blue" | pbcopy
                  ;;
                shot:*)
                  # A picture to look at (AboutUITests): "shot:<name>:<x>,<y>,<w>,<h>"
                  rest=${request#shot:}
                  name=${rest%%:*}
                  rect=${rest#*:}
                  echo "== shot $name $rect"
                  screencapture -x -R "$rect" "measurements/$name.png"
                  printf 'shot-done:%s' "$name" | pbcopy
                  ;;
                sample:*)
                  # A test found the app hanging: what its threads are doing
                  id=${request#sample:}
                  echo "== sample $id"
                  sample Schnellbild 3 -file "measurements/sample-$id.txt" >/dev/null 2>&1
                  head -c 60000 "measurements/sample-$id.txt" 2>/dev/null || echo "(no sample)"
                  printf 'sampled:%s' "$id" | pbcopy
                  ;;
              esac
              sleep 0.2
            done
          ) &
          helper=$!
          status=0
          # Several tests or classes: separated by commas
          only=()
          IFS=',' read -ra selected <<< "$ONLY"
          for test in "${selected[@]}"; do
            test="$(echo "$test" | xargs)"   # "A, B": no blanks around a name
            [ -n "$test" ] && only+=(-only-testing:"$test")
          done
          TEST_RUNNER_SCHNELLBILD_APP="$PWD/build/shipped/Schnellbild.app" TEST_RUNNER_SCREEN_MEASURE=1 xcodebuild test \
            -project Schnellbild.xcodeproj \
            -scheme Schnellbild \
            -destination 'platform=macOS' \
            "${only[@]}" \
            -derivedDataPath build/DerivedData \
            ${REPEAT:+-test-iterations "$REPEAT" -run-tests-until-failure} || status=1
          kill "$helper" 2>/dev/null || true
          exit $status

      - name: Show VLC's log
        if: failure()
        run: |
          # In the app's container, where the app writes it (BrowserModel.testLogFile)
          log=~/Library/Containers/art.haushoppe.schnellbild/Data/tmp/schnellbild-vlc.log
          [ -f "$log" ] || { echo "no VLC log"; exit 0; }
          wc -l "$log"
          grep -i -E "vout|video output|vmem|error|failed|cannot|blend|spu|subpicture|freetype|libass|subtitle" "$log" | sort | uniq -c | sort -rn | head -80
          echo "--- subtitle decoders, in order"
          grep -n -E 'Creating an input|spu decoder module|killing decoder|SET_TIME|SET_POSITION|seek request|selecting|unselecting|libass|ass_|[Ff]ont|subpicture|vout found' "$log" | grep -v -E 'looking for' | tail -150 || true
          echo "--- the end of the log (the failing test's, as a repeated run stops at its first failure)"
          grep -v -E 'Buffering [0-9]+%|displayed late|late picture' "$log" | tail -400 || true

      - name: Show what macOS did with the thumbnail extension
        if: failure()
        run: ./Scripts/thumbnail_extension_report.sh

      - name: Keep what was measured
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: measurements-${{ matrix.os }}
          path: measurements/
          if-no-files-found: ignore
          retention-days: 14

  unit-repeat:
    # By hand (`-f unit=<filter> -f repeat=<n>`): a few unit tests again and
    # again on both macOS versions, to see a rare failure, or that it is gone
    name: Unit tests repeated (${{ matrix.os }})
    if: ${{ inputs.unit }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: Scripts/select_xcode.sh

      - name: Cache VLCKit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Vendor
          key: vendor-${{ hashFiles('Scripts/fetch_vlckit.sh', 'Scripts/fetch_unrar.sh', 'Scripts/fetch_map.sh', 'Scripts/map_data.env', 'Scripts/fetch_globe.sh', 'Scripts/globe_data.env') }}

      - name: Fetch VLCKit
        run: ./Scripts/fetch_vlckit.sh

      - name: Run the tests
        env:
          UNIT: ${{ inputs.unit }}
          REPEAT: ${{ inputs.repeat || '1' }}
          # FormatVisualTests' pictures (what macOS reads differs by version: DICOM …)
          FORMAT_SNAPSHOT_DIR: ${{ github.workspace }}/build/format-snapshots
        # Each run of them ends after 20 min, a hang with the hanging test named
        run: ./Scripts/test.sh --filter "$UNIT"

      - name: Keep the formats' pictures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: format-snapshots-${{ matrix.os }}
          path: build/format-snapshots/
          if-no-files-found: ignore
