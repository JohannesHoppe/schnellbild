name: CI

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'LICENSE', 'Spike/**', '.github/workflows/spike-*.yml' ]
  pull_request:
    paths-ignore: [ '**.md', 'LICENSE', 'Spike/**', '.github/workflows/spike-*.yml' ]
  workflow_dispatch:
    inputs:
      only:
        description: "UI tests to run (xcodebuild -only-testing; several separated by commas), e.g. SchnellbildUITests/VisualUITests"
        required: false
        default: SchnellbildUITests
      macos:
        description: "Run the UI tests on this runner image only, e.g. macos-26 (empty: macos-15 and macos-26)"
        required: false
        default: ""
      repeat:
        description: "Run each selected UI test up to this many times, until one fails (to catch a rare failure); empty: once"
        required: false
        default: ""

# Reads the repository; writes nothing to it
permissions:
  contents: read

# A newer push cancels an older one; a run started by hand (a few UI tests)
# has its own group, so it never cancels the full run of a push.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build, test & package
    runs-on: macos-15          # GitHub-hosted macOS runner — ships Xcode preinstalled
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Cache SwiftPM build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Cache VLCKit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Vendor
          key: vendor-${{ hashFiles('Scripts/fetch_vlckit.sh', 'Scripts/fetch_unrar.sh') }}

      - name: Fetch VLCKit
        run: ./Scripts/fetch_vlckit.sh

      - name: Test
        env:
          CHEATSHEET_PDF: ${{ github.workspace }}/build/cheat-sheet.pdf
        run: mkdir -p build && ./Scripts/test.sh

      - name: Keep the printed cheat sheet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cheat-sheet
          path: build/cheat-sheet.pdf
          if-no-files-found: error

      - name: Build app bundle (release)
        run: ./Scripts/build_app.sh

      - name: Zip app
        run: ditto -c -k --keepParent build/Schnellbild.app build/Schnellbild.app.zip

      - name: Upload app artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Schnellbild-app
          path: build/Schnellbild.app.zip
          if-no-files-found: error

  thumbnail-extension:
    # The built app's QuickLook extension, asked by macOS for each format it
    # claims; which formats macOS keeps for its own extension differs by version
    name: Thumbnail extension (${{ matrix.os }})
    needs: build-test
    permissions:
      contents: read
      actions: read            # the app from this run's artifacts
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Get the app (built by build-test in this run)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name Schnellbild-app --dir build
          ditto -x -k build/Schnellbild.app.zip build

      - name: Each format through macOS
        run: ./Scripts/check_thumbnail_extension.sh build/Schnellbild.app

      - name: Keep the thumbnails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thumbnail-check-${{ matrix.os }}
          path: build/thumbnail-check/*.png
          if-no-files-found: ignore

  ui-tests:
    # Both macOS versions: AVKit's controls look and behave differently
    # from macOS 26 on (the inline ones dim the whole picture there)
    name: UI tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.macos && format('["{0}"]', inputs.macos) || '["macos-15", "macos-26"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Cache xcodegen
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/xcodegen
          key: xcodegen-${{ hashFiles('Scripts/fetch_xcodegen.sh') }}

      - name: Install xcodegen
        run: ./Scripts/fetch_xcodegen.sh >> "$GITHUB_PATH"

      - name: Cache VLCKit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: Vendor
          key: vendor-${{ hashFiles('Scripts/fetch_vlckit.sh', 'Scripts/fetch_unrar.sh') }}

      - name: Fetch VLCKit
        run: ./Scripts/fetch_vlckit.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build the brightness meter
        run: mkdir -p build && swiftc -O Scripts/measure_brightness.swift -o build/measure_brightness

      - name: Run XCUITests
        env:
          ONLY: ${{ inputs.only || 'SchnellbildUITests' }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          # VisualUITests measure the screen through this shell, which may
          # record it: the test asks with "measure:<id>:<x>,<y>,<w>,<h>" on the
          # pasteboard and gets "measured:<id>:<mean luminance>:<std deviation>:<red>:<green>:<blue>" back.
          mkdir -p measurements
          (
            # One failed capture must not end the helper (the step runs with -e)
            set +e
            while :; do
              request=$(pbpaste 2>/dev/null || true)
              case "$request" in
                measure:*)
                  rest=${request#measure:}
                  id=${rest%%:*}
                  rect=${rest#*:}
                  shot=measurements/$id-region.png
                  screencapture -x -R "$rect" "$shot"
                  screencapture -x "measurements/$id-screen.png"
                  read -r mean spread red green blue < <(build/measure_brightness "$shot" || echo "-1 -1 -1 -1 -1")
                  echo "== measure $id $rect: $mean ± $spread (RGB $red $green $blue)"
                  printf 'measured:%s:%s:%s:%s:%s:%s' "$id" "$mean" "$spread" "$red" "$green" "$blue" | pbcopy
                  ;;
                sample:*)
                  # A test found the app hanging: what its threads are doing
                  id=${request#sample:}
                  echo "== sample $id"
                  sample Schnellbild 3 -file "measurements/sample-$id.txt" >/dev/null 2>&1
                  head -c 60000 "measurements/sample-$id.txt" 2>/dev/null || echo "(no sample)"
                  printf 'sampled:%s' "$id" | pbcopy
                  ;;
              esac
              sleep 0.2
            done
          ) &
          helper=$!
          status=0
          # Several tests or classes: separated by commas
          only=()
          IFS=',' read -ra selected <<< "$ONLY"
          for test in "${selected[@]}"; do
            test="$(echo "$test" | xargs)"   # "A, B": no blanks around a name
            [ -n "$test" ] && only+=(-only-testing:"$test")
          done
          TEST_RUNNER_SCREEN_MEASURE=1 xcodebuild test \
            -project Schnellbild.xcodeproj \
            -scheme Schnellbild \
            -destination 'platform=macOS' \
            "${only[@]}" \
            -derivedDataPath build/DerivedData \
            ${REPEAT:+-test-iterations "$REPEAT" -run-tests-until-failure} || status=1
          kill "$helper" 2>/dev/null || true
          exit $status

      - name: Show VLC's log
        if: failure()
        run: |
          [ -f /tmp/schnellbild-vlc.log ] || { echo "no VLC log"; exit 0; }
          wc -l /tmp/schnellbild-vlc.log
          grep -i -E "vout|video output|vmem|error|failed|cannot" /tmp/schnellbild-vlc.log | sort | uniq -c | sort -rn | head -80

      - name: Show what macOS did with the thumbnail extension
        if: failure()
        run: ./Scripts/thumbnail_extension_report.sh

      - name: Keep what was measured
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: measurements-${{ matrix.os }}
          path: measurements/
          if-no-files-found: ignore
          retention-days: 14
